services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kenan_cake_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./Backend:/var/www/html
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: kenan_cake_db
      DB_USERNAME: kenan_user
      DB_PASSWORD: kenan_secret_password
      CACHE_STORE: redis
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - database
      - redis
    networks:
      - kenan_network

  web:
    image: nginx:alpine
    container_name: kenan_cake_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./Backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - kenan_network

  database:
    image: mysql:8.0
    container_name: kenan_cake_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: kenan_cake_db
      MYSQL_USER: kenan_user
      MYSQL_PASSWORD: kenan_secret_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - kenan_network

  redis:
    image: redis:alpine
    container_name: kenan_cake_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kenan_network

networks:
  kenan_network:
    driver: bridge

volumes:
  db_data:
  redis_data:

